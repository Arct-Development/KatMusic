<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shared track — KatMusic</title>
<meta name="description" content="Open a shared track in KatMusic on your phone, laptop or desktop.">
<meta name="theme-color" content="#000000">
<meta property="og:title" content="A track shared with you — KatMusic">
<meta property="og:description" content="Open it in KatMusic on any device, or listen on YouTube Music.">
<meta property="og:image" content="https://katmusic.pages.dev/assets/img/icon.png">
<link rel="icon" href="assets/img/katmusic_logo.svg"><link rel="apple-touch-icon" href="assets/img/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="js/share.js" defer></script>
<style>
  :root { color-scheme: dark; --ink:#f6f5f1; --muted:#a5a8ae; --line:rgba(255,255,255,.14); --bg:#08090b; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:
    radial-gradient(70vw 60vh at 18% 0%, rgba(61,145,255,.16), transparent 65%),
    radial-gradient(55vw 50vh at 100% 20%, rgba(255,255,255,.06), transparent 60%), var(--bg);
    color:var(--ink); font:16px/1.55 Inter, system-ui, sans-serif; }
  a { color:inherit; }
  .sh-page { width:min(1040px, calc(100% - 40px)); margin:0 auto; padding:28px 0 52px; }
  .sh-nav { display:flex; align-items:center; justify-content:space-between; gap:16px; padding-bottom:54px; }
  .sh-brand { display:flex; align-items:center; gap:10px; font:600 18px/1 "Space Grotesk", sans-serif; text-decoration:none; letter-spacing:-.02em; }
  .sh-brand img { width:30px; height:30px; }
  .sh-nav > a:last-child { color:var(--muted); text-decoration:none; font-size:13px; }
  .sh-card { border:1px solid var(--line); border-radius:22px; background:rgba(18,20,24,.74); backdrop-filter:blur(18px); overflow:hidden; box-shadow:0 30px 90px rgba(0,0,0,.4); }
  .sh-kicker { margin:0; padding:24px 28px 0; color:#76b4ff; font:600 11px/1 Inter, sans-serif; letter-spacing:.18em; text-transform:uppercase; }
  .sh-body { display:grid; grid-template-columns:300px minmax(0,1fr); gap:34px; padding:28px; }
  .sh-art { width:100%; aspect-ratio:1; border-radius:14px; overflow:hidden; background:#17191e; border:1px solid var(--line); display:grid; place-items:center; position:relative; }
  .sh-art img#shArt { width:100%; height:100%; object-fit:cover; display:block; }
  .sh-art .sh-fallback { position:absolute; inset:0; display:grid; place-items:center; background:linear-gradient(145deg,#1b2330,#0e1014); }
  .sh-art .sh-fallback img { width:34%; height:34%; object-fit:contain; opacity:.95; }
  .sh-art .sh-fallback[hidden] { display:none; }
  .sh-meta { min-width:0; display:flex; flex-direction:column; justify-content:center; }
  .sh-meta h1 { margin:0 0 8px; font:600 clamp(30px,5vw,52px)/1.04 "Space Grotesk", sans-serif; letter-spacing:-.035em; overflow-wrap:anywhere; }
  .sh-artist { margin:0; color:#d8dade; font-size:18px; }
  .sh-album { margin:4px 0 0; color:var(--muted); font-size:14px; }
  .sh-actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:26px; }
  .sh-btn { appearance:none; border:1px solid var(--line); border-radius:999px; padding:11px 18px; font:600 13px/1 Inter, sans-serif; text-decoration:none; cursor:pointer; color:var(--ink); background:rgba(255,255,255,.06); }
  .sh-btn:hover { background:rgba(255,255,255,.11); }
  .sh-btn.primary { background:#f6f5f1; color:#101114; border-color:#f6f5f1; }
  .sh-btn.primary:hover { background:#fff; }
  .sh-status { margin:18px 0 0; color:var(--muted); font-size:13px; min-height:20px; }
  .sh-form { margin-top:26px; display:flex; gap:8px; flex-wrap:wrap; }
  .sh-form label { width:100%; color:var(--muted); font-size:12px; letter-spacing:.08em; text-transform:uppercase; }
  .sh-form input { flex:1 1 260px; min-width:0; border:1px solid var(--line); border-radius:999px; padding:12px 16px; background:rgba(255,255,255,.06); color:var(--ink); font:14px Inter, sans-serif; }
  .sh-form input:focus { outline:2px solid #3d91ff; outline-offset:2px; }
  .sh-form button { flex:0 0 auto; }
  .sh-note { border-top:1px solid var(--line); padding:18px 28px 22px; color:var(--muted); font-size:12px; display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .sh-note b { color:var(--ink); font-weight:500; }
  .sh-note a { color:#76b4ff; text-decoration:none; }
  .sh-note a:hover { color:#a9d0ff; }
  @media (max-width:760px) { .sh-body { grid-template-columns:1fr; gap:24px; } .sh-art { max-width:310px; } .sh-nav { padding-bottom:30px; } .sh-page { width:min(100% - 28px, 1040px); } .sh-kicker { padding:20px 20px 0; } .sh-body { padding:20px; } .sh-note { padding:16px 20px 18px; } }
</style>
</head>
<body>
<div class="sh-page">
  <header class="sh-nav">
    <a class="sh-brand" href="index.html"><img src="assets/img/katmusic_logo.svg" alt="">KatMusic</a>
    <a href="index.html">Back to the site</a>
  </header>

  <main class="sh-card">
    <p class="sh-kicker">Shared track</p>
    <div class="sh-body">
      <div class="sh-art">
        <img id="shArt" alt="" hidden>
        <div class="sh-fallback" id="shFallback"><img src="assets/img/katmusic_logo.svg" alt="KatMusic"></div>
      </div>
      <div class="sh-meta">
        <h1 id="shTitle">A track shared with you</h1>
        <p class="sh-artist" id="shArtist">Open it in KatMusic</p>
        <p class="sh-album" id="shAlbum" hidden></p>

        <form class="sh-form" id="shForm">
          <label for="shInput">Paste a KatMusic or YouTube Music link</label>
          <input id="shInput" type="text" inputmode="url" autocomplete="off" placeholder="katmusic://track?v=… or music.youtube.com/watch?v=…">
          <button class="sh-btn primary" type="submit">Open track</button>
        </form>

        <div class="sh-actions" id="shActions" hidden>
          <a class="sh-btn primary" id="shOpen" href="#">Open in KatMusic</a>
          <a class="sh-btn" id="shYt" href="#" target="_blank" rel="noopener noreferrer">YouTube Music</a>
          <a class="sh-btn" id="shGet" href="index.html#download">Get KatMusic</a>
          <button class="sh-btn" id="shCopy" type="button">Copy link</button>
        </div>
        <p class="sh-status" id="shStatus" role="status">Opening KatMusic on this device…</p>
      </div>
    </div>
    <div class="sh-note"><span><b>One link, any device.</b> Android, Windows, macOS and Linux.</span><a href="index.html#download">Download KatMusic</a></div>
  </main>
</div>
</body>
</html>

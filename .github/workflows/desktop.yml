name: Desktop builds

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            build: flutter build windows --release
            artifact: build/windows/x64/runner/Release
            package: windows-x64.zip
          - name: Linux
            os: ubuntu-22.04
            build: flutter build linux --release
            artifact: build/linux/x64/release/bundle
            package: linux-x64.tar.gz
          - name: macOS
            os: macos-latest
            build: flutter build macos --release
            artifact: build/macos/Build/Products/Release
            package: macos.zip
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-12-dev libayatana-appindicator3-dev libasound2-dev \
            libmpv-dev libkeybinder-3.0-dev libwebkit2gtk-4.1-dev \
            libsecret-1-dev libjsoncpp-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Install Dart dependencies
        run: flutter pub get

      - name: Generate secret module
        run: dart tool/obfuscate_secrets.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test --exclude-tags golden,live

      - name: Build
        run: ${{ matrix.build }}

      - name: Package
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(sed -n 's/^version: \([0-9][^+]*\).*/\1/p' pubspec.yaml | head -n1)
            if [ -z "$VERSION" ]; then VERSION="0.0.0"; fi
            VERSION="${VERSION}-${GITHUB_SHA::7}"
          fi
          OUT="dist/KatMusic-v${VERSION}-${{ matrix.package }}"
          mkdir -p dist stage/KatMusic
          cp -R "${{ matrix.artifact }}/." stage/KatMusic/
          if [ "${{ runner.os }}" = "Linux" ]; then
            if [ -f "linux/runner/katmusic_launcher.sh" ] && [ -f "stage/KatMusic/katmusic" ]; then
              if [ ! -f "stage/KatMusic/katmusic.bin" ]; then
                mv stage/KatMusic/katmusic stage/KatMusic/katmusic.bin
              fi
              cp linux/runner/katmusic_launcher.sh stage/KatMusic/katmusic
              chmod +x stage/KatMusic/katmusic stage/KatMusic/katmusic.bin
            fi
          fi
          case "${{ runner.os }}" in
            Windows) (cd stage && 7z a -tzip "../${OUT}" KatMusic > /dev/null) ;;
            macOS) ditto -c -k --sequesterRsrc --keepParent stage/KatMusic "$OUT" ;;
            *) tar -czf "$OUT" -C stage KatMusic ;;
          esac
          ls -lh dist

      - name: Upload desktop package
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: desktop/dist/*
          if-no-files-found: error

  publish:
    name: Attach desktop packages to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download desktop packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List packages
        run: ls -lh dist

      - name: Publish to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "KatMusic ${GITHUB_REF_NAME}" \
            --generate-notes \
            || gh release upload "${GITHUB_REF_NAME}" dist/* \
              --repo "${GITHUB_REPOSITORY}" --clobber

name: Desktop builds

on:
  push:
    branches: [main]
    # Desktop tags are namespaced so a desktop build never publishes into an
    # Android release (the two platforms version independently).
    tags: ["desktop-v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            build: flutter build windows --release
            artifact: build/windows/x64/runner/Release
            package: windows-x64.zip
          - name: Linux
            os: ubuntu-22.04
            build: flutter build linux --release
            artifact: build/linux/x64/release/bundle
            package: linux-x64.tar.gz
          - name: macOS
            os: macos-latest
            build: flutter build macos --release
            artifact: build/macos/Build/Products/Release
            package: macos.zip
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-12-dev libayatana-appindicator3-dev libasound2-dev \
            libmpv-dev libkeybinder-3.0-dev libwebkit2gtk-4.1-dev \
            libsecret-1-dev libjsoncpp-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Install Dart dependencies
        run: flutter pub get

      - name: Set up Rust
        if: runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@stable

      - name: Build QuickJS native library
        if: runner.os == 'Windows'
        run: |
          cargo build --manifest-path native/quickjs_cipher/Cargo.toml --release
          Copy-Item native/quickjs_cipher/target/release/quickjs_cipher.dll quickjs_cipher.dll -Force

      - name: Generate secret module
        run: dart tool/obfuscate_secrets.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Build the Windows QuickJS DLL from the current Rust/JS sources above.
            flutter test --exclude-tags golden,live
          else
            flutter test --exclude-tags golden,live,native
          fi

      - name: Build
        run: ${{ matrix.build }}

      - name: Bundle Microsoft Visual C++ runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Ship the x64 MSVC runtime beside katmusic.exe for portable installs.
          $programFilesX86 = [Environment]::GetFolderPath('ProgramFilesX86')
          $vswhere = Join-Path $programFilesX86 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) {
            throw 'vswhere.exe was not found; cannot locate the MSVC runtime.'
          }

          $vsInstall = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsInstall) {
            throw 'Visual Studio C++ Build Tools were not found.'
          }

          $redistRoot = Join-Path $vsInstall 'VC\Redist\MSVC'
          $crt = Get-ChildItem -Path $redistRoot -Directory |
            Sort-Object Name -Descending |
            ForEach-Object {
              $candidate = Join-Path $_.FullName 'x64\Microsoft.VC143.CRT'
              if (Test-Path (Join-Path $candidate 'vcruntime140_1.dll')) {
                $candidate
              }
            } | Select-Object -First 1

          if (-not $crt) {
            throw "The x64 Microsoft.VC143.CRT folder was not found under $redistRoot."
          }

          $bundle = Join-Path (Get-Location) 'build/windows/x64/runner/Release'
          Get-ChildItem -Path $crt -File | Copy-Item -Destination $bundle -Force
          foreach ($name in @('vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll')) {
            if (-not (Test-Path (Join-Path $bundle $name))) {
              throw "Required MSVC runtime file $name was not copied to the Windows bundle."
            }
          }
          Get-ChildItem $bundle -Filter '*140*.dll' | Select-Object Name, Length

      - name: Bundle QuickJS native library
        if: runner.os == 'Windows'
        run: Copy-Item quickjs_cipher.dll build/windows/x64/runner/Release/quickjs_cipher.dll -Force

      - name: Package
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#desktop-v}"
          else
            VERSION=$(sed -n 's/^version: \([0-9][^+]*\).*/\1/p' pubspec.yaml | head -n1)
            if [ -z "$VERSION" ]; then VERSION="0.0.0"; fi
            VERSION="${VERSION}-${GITHUB_SHA::7}"
          fi
          OUT="dist/KatMusic-v${VERSION}-${{ matrix.package }}"
          mkdir -p dist stage/KatMusic
          cp -R "${{ matrix.artifact }}/." stage/KatMusic/
          if [ "${{ runner.os }}" = "Linux" ]; then
            if [ -f "linux/runner/katmusic_launcher.sh" ] && [ -f "stage/KatMusic/katmusic" ]; then
              if [ ! -f "stage/KatMusic/katmusic.bin" ]; then
                mv stage/KatMusic/katmusic stage/KatMusic/katmusic.bin
              fi
              cp linux/runner/katmusic_launcher.sh stage/KatMusic/katmusic
              chmod +x stage/KatMusic/katmusic stage/KatMusic/katmusic.bin
            fi
          fi
          case "${{ runner.os }}" in
            Windows) (cd stage && 7z a -tzip "../${OUT}" KatMusic > /dev/null) ;;
            macOS) ditto -c -k --sequesterRsrc --keepParent stage/KatMusic "$OUT" ;;
            *) tar -czf "$OUT" -C stage KatMusic ;;
          esac
          ls -lh dist

      - name: Upload desktop package
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: desktop/dist/*
          if-no-files-found: error

  publish:
    name: Attach desktop packages to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download desktop packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List packages
        run: ls -lh dist

      - name: Publish to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "KatMusic Desktop ${GITHUB_REF_NAME#desktop-v}" \
            --generate-notes \
            || gh release upload "${GITHUB_REF_NAME}" dist/* \
              --repo "${GITHUB_REPOSITORY}" --clobber

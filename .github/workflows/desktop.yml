name: Desktop builds

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            package: windows-x64.zip
          - name: Linux
            os: ubuntu-22.04
            package: linux-x64.tar.gz
          - name: macOS
            os: macos-latest
            package: macos.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev fakeroot

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The :shared module compiles for both Android and desktop, so Gradle
      # needs the Android SDK to configure the build even when only the
      # desktop application is packaged.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Shared logic tests
        run: ./gradlew :shared:desktopTest

      - name: Build desktop app
        run: ./gradlew :desktop:createDistributable

      - name: Package
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-${GITHUB_SHA::7}"
          fi
          OUT="dist/KatMusic-v${VERSION}-${{ matrix.package }}"
          mkdir -p dist stage/KatMusic
          cp -R "desktop/build/compose/binaries/main/app/." stage/KatMusic/
          case "${{ runner.os }}" in
            Windows) (cd stage && 7z a -tzip "../${OUT}" KatMusic > /dev/null) ;;
            macOS) ditto -c -k --sequesterRsrc --keepParent stage/KatMusic "$OUT" ;;
            *) tar -czf "$OUT" -C stage KatMusic ;;
          esac
          ls -lh dist

      - name: Upload desktop package
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Attach desktop packages to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download desktop packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List packages
        run: ls -lh dist

      - name: Publish to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "KatMusic ${GITHUB_REF_NAME}" \
            --generate-notes \
            || gh release upload "${GITHUB_REF_NAME}" dist/* \
              --repo "${GITHUB_REPOSITORY}" --clobber

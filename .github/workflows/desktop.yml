name: Desktop builds

on:
  push:
    branches: [main, kmp]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep the daemon below the runner's memory budget: desktop packaging runs
  # jpackage plus the shared Compose compilation in the same build.
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m"

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            slug: windows-x64
            installer_task: packageMsi
            installer_glob: desktop/build/compose/binaries/main/msi/*.msi
            installer_ext: msi
            portable: zip
          - name: macOS Apple silicon
            os: macos-latest
            slug: macos-arm64
            installer_task: packageDmg
            installer_glob: desktop/build/compose/binaries/main/dmg/*.dmg
            installer_ext: dmg
            portable: zip
          - name: macOS Intel
            os: macos-15-intel
            slug: macos-x64
            installer_task: packageDmg
            installer_glob: desktop/build/compose/binaries/main/dmg/*.dmg
            installer_ext: dmg
            portable: zip
          - name: Linux x64
            os: ubuntu-22.04
            slug: linux-x64
            installer_task: packageDeb
            installer_glob: desktop/build/compose/binaries/main/deb/*.deb
            installer_ext: deb
            portable: tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev fakeroot

      # jpackage's MSI backend needs WiX 3.14; GitHub's Windows image ships
      # it, but install it explicitly so a future image change cannot break
      # packaging (the newer WiX 4/5 is not compatible with JDK 17).
      - name: Ensure WiX 3.14 for MSI packaging
        if: runner.os == 'Windows'
        run: |
          if ! command -v candle >/dev/null 2>&1; then
            choco install wixtoolset --version=3.14.1 -y --no-progress
            echo "$(cygpath 'C:\Program Files (x86)\WiX Toolset v3.14\bin')" >> "$GITHUB_PATH"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The :shared module compiles for Android as well as desktop, so Gradle
      # needs the Android SDK to configure the build even when only the
      # desktop application is packaged.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Resolve package version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(grep -m1 'versionName = ' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')"
            VERSION="${VERSION:-0.0.0}-${GITHUB_SHA::7}"
          fi
          echo "APP_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Packaging KatMusic v${VERSION}"

      - name: Test shared logic and desktop
        run: ./gradlew :shared:desktopTest :desktop:test --stacktrace

      - name: Build installer and app image
        run: ./gradlew :desktop:${{ matrix.installer_task }} :desktop:createDistributable --stacktrace

      - name: Stage installer and portable package
        run: |
          set -euo pipefail
          mkdir -p dist
          installer="$(ls ${{ matrix.installer_glob }} | head -n1)"
          cp "$installer" "dist/KatMusic-v${APP_VERSION}-${{ matrix.slug }}.${{ matrix.installer_ext }}"

          case "${{ matrix.portable }}" in
            zip)
              if [[ "${{ runner.os }}" == "Windows" ]]; then
                mkdir -p stage
                cp -R desktop/build/compose/binaries/main/app/. stage/KatMusic/
                (cd stage && 7z a -tzip "../dist/KatMusic-v${APP_VERSION}-${{ matrix.slug }}-portable.zip" KatMusic > /dev/null)
              else
                ditto -c -k --sequesterRsrc --keepParent \
                  desktop/build/compose/binaries/main/app/KatMusic.app \
                  "dist/KatMusic-v${APP_VERSION}-${{ matrix.slug }}-portable.zip"
              fi
              ;;
            tar.gz)
              tar -czf "dist/KatMusic-v${APP_VERSION}-${{ matrix.slug }}-portable.tar.gz" \
                -C desktop/build/compose/binaries/main/app KatMusic
              ;;
          esac
          ls -lh dist

      - name: Upload desktop packages
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.slug }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Attach desktop packages to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download desktop packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate desktop checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS-desktop.txt
          cat SHA256SUMS-desktop.txt

      - name: Publish to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "KatMusic ${GITHUB_REF_NAME}" \
            --generate-notes \
            || gh release upload "${GITHUB_REF_NAME}" dist/* \
              --repo "${GITHUB_REPOSITORY}" --clobber

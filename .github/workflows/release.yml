name: Publish Selected Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release version (must match app/build.gradle.kts)'
        required: true
        default: '2.6.0'
      release_name:
        description: 'Public release title'
        required: true
        default: 'KatMusic 2.6.0'
      release_notes:
        description: 'Changelog / Release Notes'
        required: false
        default: |
          ## KatMusic 2.6.0

          ### Added
          - KatMusic Cover: an artwork-first 1×1 and 2×1 home-screen widget with one-tap play/pause.
          - Animated Group Blend match gauge and corrected cloud member scoring.
          - A more cinematic alternate-player motion system with ambient colour, breathing/rotating covers, lyric crossfades and a pulsing timeline.
          - Polished startup handoff from the final logo-video frame into the wordmark lockup.

          ### Changed
          - Refined Group Blend cloud flows, release documentation and current app screenshots.

          ### Fixed
          - Cloud Blend members now populate the compatibility list; leaving a Blend restores the local group.
          - Tagged release signing now uses the same key contract as the manual release workflow.

          ### Build
          - Universal, ARM64 and Android 7–9 legacy APK packages.
          - Windows, Linux and macOS desktop packages.
jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      RELEASE_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
      EXPECTED_CERT_SHA256: ${{ secrets.EXPECTED_CERT_SHA256 }}
      KATMUSIC_BLEND_SUPABASE_URL: ${{ secrets.KATMUSIC_BLEND_SUPABASE_URL }}
      KATMUSIC_BLEND_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.KATMUSIC_BLEND_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate release version
        env:
          REQUESTED_TAG: ${{ inputs.tag_name }}
        run: |
          APP_VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          REQUESTED_VERSION="${REQUESTED_TAG#v}"
          if [ "$APP_VERSION" != "$REQUESTED_VERSION" ]; then
            echo "::error::Requested tag $REQUESTED_TAG does not match app version $APP_VERSION"
            exit 1
          fi
          echo "Preparing KatMusic $APP_VERSION"
          
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Build Android 10 Release APKs (compressed + raw)
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          RELEASE_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ALIAS || secrets.RELEASE_KEY_ALIAS || 'release_key' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease assembleRawRelease --stacktrace

        # NOTE: Gradle signs release + rawRelease in place via the
        # release_config signingConfig (v1+v2+v3), so no separate re-sign
        # step is needed. A missing keystore now fails the build outright
        # instead of silently shipping a debug-signed APK.

      - name: Stage Android 10 Final APKs
        run: |
          mkdir -p final_apk
          TAG="${{ inputs.tag_name }}"
          # Universal release (Android 10+, R8 + ProGuard + shrinkResources)
          if [ -f "app/build/outputs/apk/release/app-release-signed.apk" ]; then
            cp app/build/outputs/apk/release/app-release-signed.apk final_apk/KatMusic-v${TAG}-universal.apk
          else
            cp app/build/outputs/apk/release/app-release.apk final_apk/KatMusic-v${TAG}-universal.apk
          fi
          # Universal uncompressed variant (Android 10+, raw debuggable/unminified)
          if [ -f "app/build/outputs/apk/rawRelease/app-rawRelease-signed.apk" ]; then
            cp app/build/outputs/apk/rawRelease/app-rawRelease-signed.apk final_apk/KatMusic-v${TAG}-universal-uncompressed.apk
          else
            cp app/build/outputs/apk/rawRelease/app-rawRelease.apk final_apk/KatMusic-v${TAG}-universal-uncompressed.apk
          fi
          rm -rf app/build/outputs/apk/release/*

      - name: Build Android 7.0 Legacy APK (compressed)
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          RELEASE_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ALIAS || secrets.RELEASE_KEY_ALIAS || 'release_key' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PminSdk=24 --stacktrace

      - name: Sign Android 7 Legacy APK with Custom Key (Optional)
        if: env.SIGNING_KEY != ''
        uses: r0adkll/sign-android-release@v1
        id: sign_app_legacy
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS || secrets.RELEASE_KEY_ALIAS || 'release_key' }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Stage Android 7 Final APK
        run: |
          TAG="${{ inputs.tag_name }}"
          if [ -f "app/build/outputs/apk/release/app-release-signed.apk" ]; then
            cp app/build/outputs/apk/release/app-release-signed.apk final_apk/KatMusic-v${TAG}-android7.apk
          else
            cp app/build/outputs/apk/release/app-release.apk final_apk/KatMusic-v${TAG}-android7.apk
          fi
          ls -lh final_apk/

      - name: Build Android 10+ ARM64 Release APK
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          RELEASE_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ALIAS || secrets.RELEASE_KEY_ALIAS || 'release_key' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PtargetAbis=arm64-v8a --stacktrace

      - name: Stage ARM64 Release APK
        run: |
          TAG="${{ inputs.tag_name }}"
          APK="app/build/outputs/apk/release/app-release.apk"
          if [ -f "app/build/outputs/apk/release/app-release-signed.apk" ]; then
            APK="app/build/outputs/apk/release/app-release-signed.apk"
          fi
          unzip -Z1 "$APK" | grep -q '^lib/arm64-v8a/' || {
            echo "::error::ARM64 release APK is missing arm64-v8a native libraries"
            exit 1
          }
          if unzip -Z1 "$APK" | grep -q '^lib/armeabi-v7a/'; then
            echo "::error::ARM64-only release APK unexpectedly contains 32-bit ARM libraries"
            exit 1
          fi
          cp "$APK" "final_apk/KatMusic-v${TAG}-arm64-v8a.apk"
          ls -lh final_apk/

      - name: Verify APK signatures + publish checksums
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.EXPECTED_CERT_SHA256 }}
        run: |
          # Never publish a package the installer will reject as invalid, and
          # never ship an APK signed by the wrong key. apksigner verify only
          # proves *a* signature is valid, not whose it is — so we also pin the
          # signer certificate digest.
          # EXPECTED_CERT_SHA256 defaults to the current release key prefix;
          # override with the full digest via a repo secret when the key rotates.
          SDKROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=$(find "$SDKROOT/build-tools" -maxdepth 2 -name apksigner 2>/dev/null | head -n1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found under $SDKROOT — refusing to publish unverified APKs"
            exit 1
          fi
          EXPECTED_CERT_SHA256="${EXPECTED_CERT_SHA256:-ed79fe6f}"
          for apk in final_apk/*.apk; do
            echo "Verifying $apk ..."
            "$APKSIGNER" verify --print-certs "$apk" > /dev/null || { echo "::error::APK failed signature verification: $apk"; exit 1; }
            CERT_SHA=$("$APKSIGNER" verify --print-certs "$apk" 2>/dev/null | grep -i 'SHA-256 digest' | head -n1 | awk '{print $NF}' | tr 'A-F' 'a-f')
            if [ -z "$CERT_SHA" ]; then
              echo "::error::Could not read signing certificate digest for $apk"; exit 1
            fi
            case "$CERT_SHA" in
              ${EXPECTED_CERT_SHA256}*) echo "Signer cert OK: $CERT_SHA" ;;
              *) echo "::error::$apk signed by unexpected certificate ($CERT_SHA); expected prefix ${EXPECTED_CERT_SHA256}"; exit 1 ;;
            esac
          done
          echo "All APK signatures valid and match the pinned certificate."
          (cd final_apk && sha256sum *.apk > SHA256SUMS.txt)
          cat final_apk/SHA256SUMS.txt

      - name: Prepare Release Notes & Compatibility Notice
        env:
          TAG: ${{ inputs.tag_name }}
          NOTES: ${{ inputs.release_notes }}
        run: |
          cat << 'EOF' | sed 's/^ *//' > notice.md
          ### 📦 Download Packages & Compatibility

          | Package | Recommended OS | Description |
          | :--- | :--- | :--- |
          | **`KatMusic-v__TAG__-universal.apk`** (~22 MB) | **Android 10+ (Android 10 – 16+)** | **Standard Recommended Release.** R8-optimized universal APK for supported CPU architectures. |
          | **`KatMusic-v__TAG__-arm64-v8a.apk`** | **Android 10+ (64-bit ARM)** | **ARM64 build.** Smaller ABI-specific package for arm64-v8a phones and tablets. |
          | **`KatMusic-v__TAG__-universal-uncompressed.apk`** (~89 MB) | **Android 10+ (Android 10 – 16+)** | **Raw Release.** Unminified debuggable variant with uncompressed native libraries. |
          | **`KatMusic-v__TAG__-android7.apk`** (~17 MB) | **Android 7.0 – 9.0 (Legacy)** | **Legacy Android 7.0+ Variant.** Built with compressed native libraries for older package managers. |
          | `KatMusic-v__TAG__-windows-x64.zip` | Windows 10 / 11 (64-bit) | Portable desktop build — extract and run `KatMusic.exe`. |
          | `KatMusic-v__TAG__-linux-x64.tar.gz` | Linux (64-bit) | Portable desktop bundle — extract and run the KatMusic binary. |
          | `KatMusic-v__TAG__-macos.zip` | macOS 12+ | Unsigned `.app` bundle — right-click → Open on first launch. |

          > [!WARNING]
          > **Notice for Android 7.0 – 9.0 Users (`KatMusic-v__TAG__-android7.apk`):**
          > - Hardware GPU glassmorphism / live blur requires Android 12+ and is automatically replaced with translucent dark canvas acrylic styling on older devices.
          > - The media notification uses classic Android media controls rather than Android 13's wavy-progress player.
          > - For any device running Android 10 or newer, please install the standard **`KatMusic-v__TAG__-universal.apk`** for optimal performance and memory efficiency.
          EOF

          sed -i "s/__TAG__/${TAG}/g" notice.md

          if echo "$NOTES" | grep -q "android7"; then
            printf "%s\n" "$NOTES" > release_body.md
          elif [ -n "$NOTES" ]; then
            printf "%s\n\n---\n\n" "$NOTES" > release_body.md
            cat notice.md >> release_body.md
          else
            cat notice.md > release_body.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: ${{ inputs.release_name }}
          body_path: release_body.md
          files: |
            final_apk/*.apk
            final_apk/SHA256SUMS.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Desktop packages ship with the same release. They build after the release
  # exists so each platform's asset lands on the same tag the website reads.
  desktop:
    name: Build desktop (${{ matrix.name }})
    needs: release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            build: flutter build windows --release
            artifact: build/windows/x64/runner/Release
            package: windows-x64.zip
          - name: Linux
            os: ubuntu-22.04
            build: flutter build linux --release
            artifact: build/linux/x64/release/bundle
            package: linux-x64.tar.gz
          - name: macOS
            os: macos-latest
            build: flutter build macos --release --no-codesign
            artifact: build/macos/Build/Products/Release
            package: macos.zip
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-12-dev libayatana-appindicator3-dev libasound2-dev \
            libmpv-dev libkeybinder-3.0-dev libwebkit2gtk-4.1-dev \
            libsecret-1-dev libjsoncpp-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Install Dart dependencies
        run: flutter pub get

      - name: Generate secret module
        run: dart tool/obfuscate_secrets.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test --exclude-tags golden,live

      - name: Build
        run: ${{ matrix.build }}

      - name: Package
        shell: bash
        run: |
          mkdir -p dist stage/KatMusic
          cp -R "${{ matrix.artifact }}/." stage/KatMusic/
          OUT="dist/KatMusic-v${{ inputs.tag_name }}-${{ matrix.package }}"
          case "${{ runner.os }}" in
            Windows) (cd stage && 7z a -tzip "../${OUT}" KatMusic > /dev/null) ;;
            macOS) ditto -c -k --sequesterRsrc --keepParent stage/KatMusic "$OUT" ;;
            *) tar -czf "$OUT" -C stage KatMusic ;;
          esac
          ls -lh dist

      - name: Upload desktop package
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: desktop/dist/*
          if-no-files-found: error

  attach-desktop:
    name: Attach desktop packages to release
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download desktop packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List packages
        run: ls -lh dist

      - name: Upload to the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.tag_name }}
          files: dist/*
          fail_on_unmatched_files: true

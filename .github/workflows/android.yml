name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        env:
          KATMUSIC_BLEND_SUPABASE_URL: ${{ secrets.KATMUSIC_BLEND_SUPABASE_URL }}
          KATMUSIC_BLEND_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.KATMUSIC_BLEND_SUPABASE_PUBLISHABLE_KEY }}
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        env:
          KATMUSIC_BLEND_SUPABASE_URL: ${{ secrets.KATMUSIC_BLEND_SUPABASE_URL }}
          KATMUSIC_BLEND_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.KATMUSIC_BLEND_SUPABASE_PUBLISHABLE_KEY }}
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: katmusic-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # A dedicated arm64-v8a build for modern 64-bit ARM Android devices.
      # Keep the universal debug APK above for other supported CPU architectures.
      - name: Build ARM64 (arm64-v8a) debug APK
        env:
          KATMUSIC_BLEND_SUPABASE_URL: ${{ secrets.KATMUSIC_BLEND_SUPABASE_URL }}
          KATMUSIC_BLEND_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.KATMUSIC_BLEND_SUPABASE_PUBLISHABLE_KEY }}
        run: ./gradlew :app:assembleDebug -PtargetAbis=arm64-v8a --stacktrace

      - name: Verify ARM64 APK ABI
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          unzip -Z1 "$APK" | grep -q '^lib/arm64-v8a/' || {
            echo "::error::The APK does not contain arm64-v8a native libraries"
            exit 1
          }
          if unzip -Z1 "$APK" | grep -q '^lib/armeabi-v7a/'; then
            echo "::error::The ARM64-only APK unexpectedly contains 32-bit ARM libraries"
            exit 1
          fi
          mkdir -p dist
          cp "$APK" dist/KatMusic-arm64-v8a-debug.apk
          sha256sum dist/KatMusic-arm64-v8a-debug.apk > dist/SHA256SUMS.txt

      - name: Upload ARM64 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: katmusic-arm64-v8a-debug-apk
          path: dist/*
          if-no-files-found: error

  release:
    name: Build release APK
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Tagged builds use the same signing contract as the manual release
      # workflow. The Gradle release-config reads SIGNING_KEY and the three
      # password/alias environment variables directly; it refuses to fall back
      # to a debug key, so a missing secret is a clear failure instead of an
      # APK that cannot install over an existing KatMusic build.
      - name: Build release APK
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          RELEASE_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ALIAS || secrets.RELEASE_KEY_ALIAS || 'release_key' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Rename APK for the release
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk \
             "dist/katmusic-${GITHUB_REF_NAME}.apk"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: katmusic-release-apk
          path: dist/katmusic-*.apk
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/katmusic-*.apk \
            --title "KatMusic ${GITHUB_REF_NAME}" \
            --generate-notes \
            || gh release upload "${GITHUB_REF_NAME}" dist/katmusic-*.apk --clobber
